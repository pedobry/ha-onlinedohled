name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the manifest version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python3 -c 'import json; print(json.load(open("custom_components/onlinedohled/manifest.json"))["version"])')"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists"
            exit 0
          fi
          gh release create "$version" \
            --title "$version" \
            --notes "Verze ${version} integrace Online Dohled." \
            --target "${GITHUB_SHA}"
